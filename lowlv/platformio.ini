[platformio]
default_envs = esp32-s3-hybrid-mcu

[env:esp32-s3-hybrid-mcu]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
extra_scripts = pre:scripts/bl4012e_bus.py, post:scripts/ota_manifest.py
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DGATEWAY_FIRMWARE=1
    -DHCR_UART_TX=43
    -DHCR_UART_RX=44
    -DCORE_DEBUG_LEVEL=0
    -O2
    -std=gnu++17
build_unflags =
    -Os
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++11
    -std=c++11
