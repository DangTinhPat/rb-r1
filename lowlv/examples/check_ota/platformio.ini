; Ví dụ kiểm tra Wi-Fi + OTA + truyền nhận hai chiều. Không thuộc luồng điều khiển chính.
[platformio]
default_envs = check_ota
; secrets.local.ini chứa mật khẩu OTA; mẫu giá trị giả ở secrets.example.ini.
extra_configs = secrets.local*.ini

; Nạp qua cáp USB (lần đầu bắt buộc phải nạp bằng cáp).
[env:check_ota]
platform = platformio/espressif32@7.1.3
; Cùng cấu hình bo với firmware chính (ESP32-S3-WROOM-1 N16R8, không dùng PSRAM).
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++11
    -std=c++11

; Nạp qua Wi-Fi: pio run -e check_ota_air -t upload
[env:check_ota_air]
extends = env:check_ota
upload_protocol = espota
upload_port = rb1-check.local
upload_flags =
    --auth=${secrets.ota_password}
