[platformio]
default_envs = check-hcr-link
extra_configs = secrets.local*.ini

[env:check-hcr-link]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DHCR_UART_TX=43
    -DHCR_UART_RX=44
    -std=gnu++17
    -O2
build_unflags =
    -Os
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++11
    -std=c++11

[env:check-hcr-link-air]
extends = env:check-hcr-link
upload_protocol = espota
upload_port = rb1-link.local
upload_flags =
    --auth=${secrets.ota_password}
