[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rb-runtime"
version = "0.1.0"
description = "RB-R1 upper-layer fold-down planner and policy inference runtime"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rb-runtime = "rb_runtime.app:main"

[tool.setuptools.packages.find]
where = ["src"]
